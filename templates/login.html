{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white p-8 rounded shadow">
    <h2 class="text-2xl font-bold mb-6">Login</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label for="id_username" class="block font-semibold mb-1">Username</label>
            {% if form.username.errors %}
                <div class="text-red-600 text-xs mb-1">{{ form.username.errors }}</div>
            {% endif %}
            <input type="text" name="username" id="id_username" value="{{ form.username.value|default:'' }}" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required autocomplete="username">
        </div>
        <div class="mb-6">
            <label for="id_password" class="block font-semibold mb-1">Password</label>
            {% if form.password.errors %}
                <div class="text-red-600 text-xs mb-1">{{ form.password.errors }}</div>
            {% endif %}
            <input type="password" name="password" id="id_password" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required autocomplete="current-password">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Login</button>
    </form>
    <p class="mt-4 text-center text-gray-600">Don't have an account? <a href="/mentee/signup/" class="text-blue-600 hover:underline">Sign up</a></p>
</div>
{% endblock %}
