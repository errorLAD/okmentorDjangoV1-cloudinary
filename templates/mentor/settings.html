{% extends 'base.html' %}
{% load static %}
{% block title %}Mentor Settings{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="bg-white rounded-lg shadow p-6 mb-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">Mentor Settings</h1>
        
        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Availability Settings -->
                <div>
                    <h2 class="text-lg font-medium text-gray-900 mb-4">Availability</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Available for Sessions</label>
                            <div class="mt-1">
                                <input type="checkbox" name="is_available" id="is_available" 
                                       {% if mentor.is_available %}checked{% endif %}>
                                <label for="is_available" class="ml-2 text-sm text-gray-600">
                                    Set your availability status
                                </label>
                            </div>
                        </div>
                        
                        <div>
                            <label for="availability_hours" class="block text-sm font-medium text-gray-700">
                                Availability Hours
                            </label>
                            <div class="mt-1">
                                <textarea id="availability_hours" name="availability_hours" rows="3"
                                          class="shadow-sm focus:ring-blue-500 focus:border-blue-500 
                                          block w-full sm:text-sm border-gray-300 rounded-md">
                                    {{ mentor.availability_hours|default:"" }}
                                </textarea>
                            </div>
                            <p class="mt-2 text-sm text-gray-500">
                                Specify your weekly availability hours (e.g., Mon-Fri 9AM-5PM)
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Account Settings -->
                <div>
                    <h2 class="text-lg font-medium text-gray-900 mb-4">Account</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Email</label>
                            <div class="mt-1">
                                <input type="email" name="email" id="email" 
                                       value="{{ request.user.email }}"
                                       class="shadow-sm focus:ring-blue-500 focus:border-blue-500 
                                       block w-full sm:text-sm border-gray-300 rounded-md" readonly>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Username</label>
                            <div class="mt-1">
                                <input type="text" name="username" id="username" 
                                       value="{{ request.user.username }}"
                                       class="shadow-sm focus:ring-blue-500 focus:border-blue-500 
                                       block w-full sm:text-sm border-gray-300 rounded-md" readonly>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pt-5">
                <div class="flex justify-end">
                    <button type="submit" 
                            class="ml-3 inline-flex justify-center py-2 px-4 border border-transparent 
                            shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 
                            hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 
                            focus:ring-blue-500">
                        Save Changes
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
